<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Convolution method from input polygons to Minkowski sum</title>
  <desc id="desc">The concave polygon and square from Figure 5.1 of the thesis produce a self-intersecting convolution cycle. Splitting its crossing creates DCEL faces with winding numbers zero, one, and two. Keeping faces with positive winding number gives a solid Minkowski sum with a notch and no hole.</desc>
  <rect width="1120" height="430" rx="18" fill="#faf9f6"/>

  <g font-family="system-ui,sans-serif" fill="#222" text-anchor="middle" font-size="20" font-weight="700">
    <text x="125" y="42">1 · P and Q</text>
    <text x="405" y="42">2 · convolution P * Q</text>
    <text x="710" y="42">3 · split edges and label faces</text>
    <text x="995" y="42">4 · P ⊕ Q</text>
  </g>

  <!-- The input pair used in thesis Figures 5.1, 5.5, and 5.6. -->
  <g transform="translate(35 95)" stroke-width="4">
    <path d="M15 225 L85 190 L155 225 L155 85 L15 85 Z" fill="#d9eee9" stroke="#175c50"/>
    <path d="M180 155 H235 V100 H180 Z" fill="#f2c9a5" stroke="#b75d28"/>
    <text x="85" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#175c50">P</text>
    <text x="208" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#b75d28">Q</text>
  </g>

  <g stroke="#6b6b65" stroke-width="3" fill="none">
    <path d="M270 215 H295" marker-end="url(#arrow)"/>
    <path d="M540 215 H565" marker-end="url(#arrow)"/>
    <path d="M855 215 H880" marker-end="url(#arrow)"/>
  </g>

  <!-- Exact translated-edge sequence of the convolution cycle in thesis Figure 5.1. -->
  <g transform="translate(310 75)" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <path d="M0 285 L70 285" stroke="#b75d28"/>
    <path d="M70 285 L140 250" stroke="#175c50"/>
    <path d="M140 250 L140 180 L70 180 L70 250" stroke="#b75d28"/>
    <path d="M70 250 L140 285" stroke="#175c50"/>
    <path d="M140 285 L210 285 L210 180 L210 110 L140 110" stroke="#b75d28"/>
    <path d="M140 110 L0 110" stroke="#175c50"/>
    <path d="M0 110 L0 180 L0 285" stroke="#b75d28"/>
    <circle cx="105" cy="267.5" r="6" fill="#fff" stroke="#493f36" stroke-width="3"/>
    <text x="105" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#493f36" stroke="none">one closed, self-intersecting cycle</text>
  </g>

  <!-- The same arrangement after splitting the crossing. -->
  <g transform="translate(585 75)" stroke-linejoin="round" stroke-width="3">
    <path d="M0 285 L70 285 L105 267.5 L140 285 L210 285 L210 110 L0 110 Z" fill="#d9eee9" stroke="#175c50"/>
    <path d="M105 267.5 L140 250 L140 180 L70 180 L70 250 Z" fill="#f2c9a5" stroke="#b75d28"/>
    <path d="M70 285 L140 250 M70 250 L140 285" fill="none" stroke="#493f36"/>
    <circle cx="105" cy="267.5" r="5" fill="#fff" stroke="#493f36"/>
    <g font-family="system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#493f36">
      <text x="105" y="90">w = 0</text>
      <text x="105" y="155">w = 1</text>
      <text x="105" y="225">w = 2</text>
    </g>
  </g>

  <!-- Union of all positive-winding faces. The w=2 face is filled, not a hole. -->
  <g transform="translate(890 75)">
    <path d="M0 285 L70 285 L105 267.5 L140 285 L210 285 L210 110 L0 110 Z" fill="#d9eee9" stroke="#175c50" stroke-width="4" stroke-linejoin="round"/>
    <text x="105" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#175c50">w &gt; 0</text>
    <text x="105" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#493f36">union of positive-winding faces</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b6b65"/>
    </marker>
  </defs>
</svg>
