<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Minkowski sum of a triangle and a square</title>
  <desc id="desc">A triangle and an axis-aligned square combine into a six-sided polygon. Every edge direction from both input shapes appears on the boundary of the sum.</desc>
  <rect width="880" height="420" rx="18" fill="#faf9f6"/>
  <text x="440" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#222">A ⊕ B = {a + b | a ∈ A, b ∈ B}</text>

  <path d="M55 315 L155 125 L255 315 Z" fill="#d9eee9" stroke="#175c50" stroke-width="4"/>
  <text x="155" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#175c50">A</text>

  <text x="300" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" fill="#6b6b65">⊕</text>

  <rect x="345" y="210" width="70" height="70" fill="#f2c9a5" stroke="#b75d28" stroke-width="4"/>
  <text x="380" y="321" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#b75d28">B</text>

  <text x="465" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" fill="#6b6b65">=</text>

  <path d="M525 315 L625 125 L695 125 L795 315 L795 385 L525 385 Z" fill="#e9dfcd" stroke="#175c50" stroke-width="4"/>
  <path d="M625 125 H695 M795 315 V385 M795 385 H525 M525 385 V315" fill="none" stroke="#b75d28" stroke-width="5"/>
  <text x="660" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#493f36">A ⊕ B</text>
</svg>
