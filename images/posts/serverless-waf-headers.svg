<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Host header and redirect separation</title>
  <desc id="desc">The WAF sends the generated application hostname upstream for Scaleway routing, then rewrites application redirects to the configured public hostname.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#506a85"/></marker>
    <style>.title{font:700 28px system-ui,-apple-system,sans-serif;fill:#17324d}.label{font:600 19px system-ui,-apple-system,sans-serif;fill:#17324d}.code{font:14px ui-monospace,SFMono-Regular,monospace;fill:#244563}.small{font:15px system-ui,-apple-system,sans-serif;fill:#47627c}.box{stroke:#506a85;stroke-width:2;rx:14}.flow{stroke:#506a85;stroke-width:3;fill:none;marker-end:url(#arrow)}.good{fill:#e7f7f0;stroke:#4b9d84;stroke-width:2;rx:12}.bad{fill:#fff1f0;stroke:#ce756d;stroke-width:2;rx:12}</style>
  </defs>
  <rect width="1200" height="530" fill="#f8fbff"/>
  <text x="60" y="58" class="title">Routing identity and public identity are different</text>
  <rect x="55" y="175" width="250" height="145" class="box" fill="#fff"/>
  <text x="127" y="220" class="label">Browser</text><text x="90" y="260" class="code">app.example.com</text>
  <rect x="465" y="150" width="255" height="195" class="box" fill="#e7f7f0"/>
  <text x="547" y="201" class="label">WAF</text><text x="495" y="244" class="small">routes to the application</text><text x="495" y="275" class="small">rewrites redirect locations</text>
  <rect x="835" y="175" width="305" height="145" class="box" fill="#fff4e5"/>
  <text x="928" y="220" class="label">Application</text><text x="858" y="260" class="code">private-app.provider.example</text>
  <path d="M 306 248 L 464 248" class="flow"/><path d="M 721 248 L 834 248" class="flow"/>
  <text x="730" y="119" class="small">Request sent upstream</text><rect x="756" y="130" width="220" height="45" class="good"/><text x="781" y="158" class="code">Host: $proxy_host</text>
  <path d="M 835 385 L 721 385" class="flow"/><path d="M 464 385 L 306 385" class="flow"/>
  <text x="83" y="421" class="small">Response returned to the browser</text><rect x="85" y="432" width="360" height="46" class="good"/><text x="108" y="461" class="code">Location: https://app.example.com/login</text>
  <text x="767" y="421" class="small">Application's original redirect</text><rect x="740" y="432" width="370" height="46" class="bad"/><text x="766" y="461" class="code">Location: https://private-app…/login</text>
</svg>
